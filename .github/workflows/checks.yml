name: checks

# Solo repository: checks run on pull requests (and by hand), not again on the
# push to main that merging a PR produces. The pre-commit hook covers direct pushes.
#
# What runs:
#   - pull request: one job, `guard` (gitleaks and the three hygiene checks) --
#     the mistakes that cannot be taken back once pushed.
#   - by hand (workflow_dispatch): `guard` plus `links`, `syntax`,
#     `otel-profiles` and `terraform`. Run them when a change touches what they
#     check, or locally (each job's commands are plain scripts):
#     gh workflow run checks.yml --ref <branch>
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: guard — secrets and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No tracked file may match an ignore rule
        # gitignore does not apply to already-tracked files, so a rule added
        # after the fact is silently inert. Catch that instead of trusting it.
        run: |
          fail=0
          while IFS= read -r f; do
            if git check-ignore --no-index -q "$f"; then
              echo "tracked but matches an ignore rule: $f"
              fail=1
            fi
          done < <(git ls-files)
          if [ "$fail" -eq 1 ]; then
            echo
            echo "Either untrack the file (git rm --cached) or add an explicit"
            echo "negation to .gitignore so the exception is deliberate."
            exit 1
          fi
          echo "OK: no tracked file is shadowed by an ignore rule"
      - name: No infrastructure state committed
        # Naming rules are not enough. A saved plan is a zip with the whole
        # tfstate inside it, so it slipped past a *.tfstate rule and shipped
        # real AWS account IDs, a bucket name and role ARNs. Check content.
        run: |
          fail=0
          # exclude the checkers themselves: they name the markers they look for
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$(file -b --mime-type "$f")" in
              application/zip)
                echo "archive committed, may carry state: $f"; fail=1; continue;;
            esac
            if grep -qa '"terraform_version"' "$f" && grep -qa '"lineage"' "$f"; then
              echo "looks like terraform state: $f"; fail=1
            fi
          done < <(git ls-files -- ':!.github/*' ':!.githooks/*')
          if [ "$fail" -eq 1 ]; then
            echo
            echo "Terraform state and saved plans record real account IDs, bucket"
            echo "names and role ARNs. Untrack it: git rm --cached <file>"
            exit 1
          fi
          echo "OK: no terraform state or archives tracked"
      - name: No machine-specific absolute paths
        # Only /Users/ — a container path such as /home/jovyan is legitimate,
        # and /Users/ is the shape that actually broke five scripts here.
        run: |
          # exclude the checkers themselves: they contain the pattern by nature
          if git grep -InI -e '/Users/' -- ':!*.md' ':!.github/*' ':!.githooks/*'; then
            echo
            echo "Use paths derived from BASH_SOURCE or __file__ instead."
            exit 1
          fi
          echo "OK: no host home paths in code"

  links:
    # Runs only by hand: gh workflow run checks.yml --ref <branch>
    if: github.event_name == 'workflow_dispatch'
    name: markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve every relative link
        run: python3 .github/scripts/check_links.py

  syntax:
    # Runs only by hand: gh workflow run checks.yml --ref <branch>
    if: github.event_name == 'workflow_dispatch'
    name: shell / python / yaml syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check tracked files
        run: ./.github/scripts/check_syntax.sh

  otel-profiles:
    # Runs only by hand: gh workflow run checks.yml --ref <branch>
    if: github.event_name == 'workflow_dispatch'
    name: otel profile conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint profiles and check they merge
        # A bare pipeline key or a redefined base component disables ClickStack's
        # own ingestion with no error at startup, so this is checked here rather
        # than left to review. See otel-profiles/CONVENTIONS.md.
        run: |
          if ! command -v yq >/dev/null; then
            sudo curl -sSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version
          ./otel-profiles/bin/lint.sh
          ./otel-profiles/bin/build-config.sh linux-host gpu-nvidia baremetal-node virt-kvm mysql > /dev/null
          ./otel-profiles/bin/build-config.sh --tier b virt-vsphere mysql aws-rds-mysql > /dev/null

  terraform:
    # Runs only by hand: gh workflow run checks.yml --ref <branch>
    if: github.event_name == 'workflow_dispatch'
    name: clickstack-config terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11"
          terraform_wrapper: false
      - name: fmt -check
        run: terraform -chdir=clickstack-config/terraform fmt -check -diff
      - name: init (no backend, provider only)
        run: terraform -chdir=clickstack-config/terraform init -backend=false
      # No `plan`/`apply` here: that needs a live ClickStack to validate
      # dashboard_json and alert configuration against (the provider calls
      # its API at plan time when reachable -- see docs/authoring.md #6),
      # and standing one up per PR is not free. `validate` still catches
      # type errors, missing required attributes and bad references; a real
      # plan/apply is a documented local step against _base/ instead (see
      # clickstack-config/README.md).
      - name: validate
        run: terraform -chdir=clickstack-config/terraform validate
