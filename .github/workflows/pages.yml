name: pages

# docs/ is not tracked in this repository (see .gitignore); this workflow
# builds the site from the README tables on every push to main that touches
# markdown or the builder, and deploys it. The repository's Pages source is
# set to "GitHub Actions", so this workflow is what publishes the site.

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet markdown
      - name: Regenerate the site from the repository
        run: python3 .github/scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
