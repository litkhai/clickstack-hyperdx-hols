# Local open-source ClickStack, for developing and verifying labs against
# something throwaway. Everything in one container: ClickHouse, HyperDX,
# MongoDB and the collector.
#
#   cd _base && cp .env.example .env && docker compose up -d
#   ./bin/check.sh
#
# The tag is pinned rather than `latest` so a lab's verification line means
# something. 2.39.1 is the HyperDX version the otel-profiles/ docs were written
# against; its collector is built from components 0.155.0.
#
# Two more services are optional and off by default, for
# labs/elastic-migration/data/ only -- the Elastic side to migrate *from*
# (profile `elastic`) and a ClickHouse pinned to the version line a Cloud
# migration lands *on* (profile `migration`, also started by `elastic`):
#
#   docker compose --profile elastic up -d
#   ./bin/seed_elasticsearch.py
#
# A third, also off by default: Grafana with both of those wired in as data
# sources (profile `grafana`), for labs/elastic-migration/dashboards/:
#
#   docker compose --profile elastic --profile grafana up -d

services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.39.1
    container_name: clickstack-local
    restart: unless-stopped
    ports:
      - "8080:8080"      # HyperDX UI
      - "8000:8000"      # HyperDX external API (/api/v2/...)
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
      - "8123:8123"      # ClickHouse HTTP
      - "9000:9000"      # ClickHouse native
      - "8888:8888"      # collector internal telemetry (Prometheus)
      - "13133:13133"    # collector health_check
    environment:
      # Set once a profile is in play. Empty is fine: the collector then runs
      # with ClickStack's own configuration only.
      CUSTOM_OTELCOL_CONFIG_FILE: ${CUSTOM_OTELCOL_CONFIG_FILE:-}
    volumes:
      - clickstack-data:/data
      - clickstack-logs:/var/log
      # The host filesystem, for the linux-host and virt-kvm profiles. Read
      # only: nothing here should ever write to the host.
      - /:/hostfs:ro
      # Uncomment together with CUSTOM_OTELCOL_CONFIG_FILE in .env:
      # - ../otel-profiles/custom.config.yaml:/etc/otelcol-contrib/custom.config.yaml:ro

  # Throwaway source cluster for labs/elastic-migration/data/. Not started by
  # a plain `docker compose up -d` -- it sits behind the `elastic` profile so
  # the existing ClickStack-only workflow is unaffected:
  #
  #   docker compose --profile elastic up -d
  #
  # Single node, security disabled (xpack.security.enabled=false). That is
  # only acceptable because this holds nothing but synthetic seed data on
  # localhost -- never do this against a cluster with real data.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch-local
    restart: unless-stopped
    profiles: ["elastic"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"      # REST API
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # The same Elasticsearch with security ON, which is the default in 8.x and
  # therefore what a real source cluster looks like. Its own profile, because
  # the point of it is to exercise the authenticated path:
  #
  #   docker compose --profile elastic-secure up -d
  #   ES_URL=http://localhost:9201 ES_USER=elastic ES_PASSWORD=... \
  #       ./bin/seed_elasticsearch.py --recreate --docs 20000
  #
  # HTTP TLS is off here on purpose. Authentication is the thing every tool
  # needed and did not have; a self-signed CA on top would mean copying a
  # certificate out of the container before anything works, which makes the
  # profile awkward enough that nobody would run it. The CA path is covered
  # instead by ES_CA_CERT, verified by hand against a default-configuration
  # container (see labs/elastic-migration/data/README.md).
  #
  # The password is a published local default, like the ClickHouse `api` user
  # above: override it with ES_SECURE_PASSWORD in .env if you care, and never
  # reuse this shape anywhere real.
  elasticsearch-secure:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch-secure-local
    restart: unless-stopped
    profiles: ["elastic-secure"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ELASTIC_PASSWORD: ${ES_SECURE_PASSWORD:-elastic-local-only}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9201:9200"      # REST API, authenticated
    volumes:
      - elasticsearch-secure-data:/usr/share/elasticsearch/data

  # The migration *destination* for labs/elastic-migration/, and deliberately
  # not the ClickHouse inside the all-in-one image above.
  #
  #   docker compose --profile migration up -d     # target only
  #   docker compose --profile elastic up -d       # source + target, one command
  #
  # Two reasons for a second ClickHouse rather than reusing port 8123:
  #
  #  1. Version. A migration lands in ClickHouse Cloud, whose regular release
  #     channel is on the 26.6 line (a live Cloud service reports
  #     26.6.1.2191); the all-in-one 2.39.1 bundles 26.8.7.19. Verifying a
  #     migration against a *newer* ClickHouse than the destination can prove
  #     a feature the destination does not have yet, which is the one thing a
  #     migration lab must not do. 26.6.8.7 is the newest public patch of that
  #     line -- the same minor as Cloud, not the same build, since Cloud's
  #     builds are not published.
  #  2. Shape. The destination of a migration is a plain ClickHouse endpoint,
  #     not HyperDX's own instance, and the load path in
  #     labs/elastic-migration/data/ touches ClickHouse only.
  #
  # `default` with no password, reachable from the host -- unlike the
  # all-in-one image, the plain server image does not restrict `default` to
  # its own localhost. Acceptable for the same reason as the Elasticsearch
  # above: throwaway, synthetic, localhost. Never this shape anywhere real.
  clickhouse-target:
    image: clickhouse/clickhouse-server:26.6.8.7
    container_name: clickhouse-target-local
    restart: unless-stopped
    profiles: ["elastic", "migration"]
    environment:
      # Recent server images refuse a passwordless `default` (REQUIRED_PASSWORD)
      # and mint a random one at first start, which a lab cannot then put in a
      # documented command. This skips that setup and leaves the built-in
      # `default` user with no password -- the same throwaway-only trade-off as
      # xpack.security.enabled=false above, and no credential to commit.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8124:8123"      # HTTP -- CH_TARGET_URL in .env.example
      - "9001:9000"      # native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-target-data:/var/lib/clickhouse

  # Grafana for labs/elastic-migration/dashboards/: a dashboard written against
  # the Elasticsearch data source above, converted to the ClickHouse data
  # source on `clickhouse-target`, and both checked through Grafana's own
  # /api/ds/query. Not started by a plain `docker compose up -d`:
  #
  #   docker compose --profile elastic --profile grafana up -d
  #
  # It has no depends_on on purpose: the two sources live in another profile,
  # and a depends_on on a service whose profile is off is an error. Start both
  # profiles together; the data sources are only contacted when queried.
  #
  # Both plugins are installed at startup by GF_PLUGINS_PREINSTALL_SYNC, which
  # needs internet access. Since Grafana 13 the Elasticsearch data source is a
  # separate plugin, and unpinned it floats: the versions are pinned so a
  # verification line means something. Both data sources are provisioned from
  # ./grafana/provisioning.
  #
  # admin / grafana-local-only is a published local default, like
  # ES_SECURE_PASSWORD above: throwaway, localhost only, never this shape
  # anywhere real. Override with GRAFANA_ADMIN_PASSWORD in .env.
  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana-local
    restart: unless-stopped
    profiles: ["grafana"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.22.0,elasticsearch@12.9.1
    ports:
      - "3000:3000"      # Grafana UI and HTTP API
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  clickstack-data:
  clickstack-logs:
  elasticsearch-data:
  elasticsearch-secure-data:
  clickhouse-target-data:
  grafana-data:
