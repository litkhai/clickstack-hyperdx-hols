# Fixture for verifying otel-profiles/ in Docker only: the linux-host profile
# (issue #53) and both halves of the mysql profile (issue #54) against the
# local stack in docker-compose.yml. A compose override, so a plain
# `docker compose up -d` is unaffected.
#
#   cd _base
#   ../otel-profiles/bin/build-config.sh linux-host > ../otel-profiles/custom.config.yaml
#   docker compose -f docker-compose.yml -f docker-compose.otel-verify.yml \
#       --profile ubuntu-noble up -d --build
#
# then `--profile ubuntu-jammy` instead of `ubuntu-noble` (stop the first one),
# or `--profile mysql` for the MySQL half. See "Verifying the otel-profiles in
# Docker" in README.md for the whole run.
#
# Why this exists. On macOS and Windows `/:/hostfs:ro` is Docker Desktop's own
# Linux VM, and that VM has no syslog: its /var/log holds only `lastlog`. The
# profiles read /hostfs/var/log/syslog and /hostfs/var/log/mysql/*.log, so
# something has to write them. A named volume can be mounted at
# /hostfs/var/log (the directory exists in the VM) but not at
# /hostfs/var/log/mysql ("read-only file system" -- the parent is read-only
# and has no such directory). So one volume, `otel-verify-logs`, goes at
# /hostfs/var/log in ClickStack, and the writers put their files in it:
# /var/log/syslog from rsyslog, /var/log/mysql/{error,mysql-slow}.log from
# MySQL. The profiles' own configs and paths are not changed.

services:
  clickstack:
    environment:
      # Overrides the empty default in docker-compose.yml.
      CUSTOM_OTELCOL_CONFIG_FILE: /etc/otelcol-contrib/custom.config.yaml
    volumes:
      # Generated by otel-profiles/bin/build-config.sh and gitignored. It must
      # exist before `up`, or Docker creates a directory in its place.
      - ../otel-profiles/custom.config.yaml:/etc/otelcol-contrib/custom.config.yaml:ro
      # Hides the VM's /var/log (only `lastlog`) and nothing else.
      - otel-verify-logs:/hostfs/var/log:ro

  # Two Ubuntu releases, one after the other, writing the same
  # /var/log/syslog. They exist because Ubuntu 24.04 changed rsyslog's default
  # file format: 22.04 sets RSYSLOG_TraditionalFileFormat (RFC 3164,
  # `Oct  1 04:14:15 host tag: msg`), 24.04 does not and writes ISO 8601
  # (`2026-10-01T04:13:39.637057+00:00 host tag: msg`). The linux-host profile
  # parses both. Each one is the package's default rsyslog configuration with
  # imklog turned off: a container has no kernel log to read. Different
  # `hostname:` values tell their rows apart in LogAttributes['host'].
  #
  # Run one at a time. The profiles keep a bare `up -d` from starting both.
  # Tags and versions were read from Docker Hub and `apt-cache policy` on
  # 2026-10-01; see README.md.
  syslog-noble:
    profiles: ["ubuntu-noble"]
    build:
      context: ./otel-verify/syslog
      args:
        UBUNTU_TAG: noble-20260911
        RSYSLOG_VERSION: 8.2312.0-3ubuntu9.4
    image: otel-verify-syslog:noble-20260911
    container_name: otel-verify-syslog-noble
    hostname: ubuntu-noble
    restart: unless-stopped
    volumes:
      - otel-verify-logs:/var/log

  syslog-jammy:
    profiles: ["ubuntu-jammy"]
    build:
      context: ./otel-verify/syslog
      args:
        UBUNTU_TAG: jammy-20260901.2
        RSYSLOG_VERSION: 8.2112.0-2ubuntu2.5
    image: otel-verify-syslog:jammy-20260901.2
    container_name: otel-verify-syslog-jammy
    hostname: ubuntu-jammy
    restart: unless-stopped
    volumes:
      - otel-verify-logs:/var/log

  # MySQL 8.4 LTS for the mysql profile. Error log and slow log go to the log
  # volume; the official image otherwise logs to stderr. `otel_monitor` is
  # created by the image (MYSQL_USER / MYSQL_PASSWORD) and given the grant from
  # the profile README's Prerequisites by otel-verify/mysql/10-otel-monitor.sql.
  #
  # The password is a published local default, like ES_SECURE_PASSWORD in
  # docker-compose.yml: override MYSQL_MONITOR_PASSWORD in .env if you care,
  # and never reuse this shape anywhere real. The root password is random and
  # not needed; nothing here connects as root. Throwaway, localhost only.
  #
  # 3306 is published on 127.0.0.1 only, so a sidecar container reaches it as
  # host.docker.internal:3306 (MYSQL_ENDPOINT).
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4.11
    container_name: otel-verify-mysql
    # Not `unless-stopped`: a failed first-start initialisation would restart
    # into a half-initialised data directory that skips the init scripts.
    restart: "no"
    entrypoint: ["sh", "/otel-verify/entrypoint.sh"]
    command:
      - mysqld
      - --log-error=/var/log/mysql/error.log
      - --slow-query-log=ON
      - --slow-query-log-file=/var/log/mysql/mysql-slow.log
      # The default is 10 s. One second is low enough that SELECT SLEEP(2)
      # lands in the slow log.
      - --long-query-time=1
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: otel_monitor
      MYSQL_PASSWORD: ${MYSQL_MONITOR_PASSWORD:-otel-local-only}
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - otel-verify-logs:/var/log
      - ./otel-verify/mysql/entrypoint.sh:/otel-verify/entrypoint.sh:ro
      - ./otel-verify/mysql/10-otel-monitor.sql:/docker-entrypoint-initdb.d/10-otel-monitor.sql:ro

volumes:
  otel-verify-logs:
