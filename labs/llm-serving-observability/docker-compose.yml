# Self-hosted LLM serving observed with ClickStack, on a laptop with no GPU.
#
#   bin/up.sh          # compose up, wait, HyperDX user + sources + dashboard
#   bin/check.py       # scenario checks (SQL and HyperDX API)
#   docker compose down -v
#
# vLLM and nvidia-smi are replaced by stand-ins (vllm-mock/, gpu-push/fake-nvidia-smi);
# the Collector configuration, the pusher and the dashboard are the ones from the article.
# Host ports are shifted (38xxx, 34000) so the lab can sit next to _base/ and labs/promql.
name: llmobs

services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.42.0
    container_name: llmobs-clickstack
    ports:
      - "127.0.0.1:${LLMOBS_UI_PORT:-38080}:8080"       # HyperDX UI
      - "127.0.0.1:${LLMOBS_API_PORT:-38000}:8000"      # HyperDX API
      - "127.0.0.1:${LLMOBS_CH_HTTP_PORT:-38123}:8123"  # ClickHouse HTTP
    volumes:
      - llmobs-data:/data
    networks: [llm-net]

  vllm:                       # stand-in for vLLM: Prometheus /metrics and an OpenAI-compatible API
    image: python:3.12-slim
    container_name: llmobs-vllm
    command: ["python", "-u", "/app/mock.py"]
    volumes:
      - ./vllm-mock/mock.py:/app/mock.py:ro
    networks: [llm-net]

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: llmobs-otelcol
    command: ["--config", "/etc/otelcol/config.yaml"]
    environment:
      CH_ENDPOINT: tcp://clickstack:9000   # the article's value: tcp://<service>.clickhouse.cloud:9440?secure=true
      CH_USER: worker                      # published dev user of the all-in-one image (`default` is refused)
      CH_PASSWORD: worker
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro                       # on Docker Desktop this is its Linux VM, not macOS or Windows
    ports:
      - "127.0.0.1:${LLMOBS_OTEL_METRICS_PORT:-38888}:8888"   # the Collector's own metrics
    restart: unless-stopped
    depends_on:
      clickstack: { condition: service_healthy }   # the exporter's create_schema needs ClickHouse up
    networks: [llm-net]

  litellm:
    image: ghcr.io/berriai/litellm:v1.108.0
    container_name: llmobs-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://otelcol:4318
      OTEL_SERVICE_NAME: litellm
      LITELLM_OTEL_INTEGRATION_ENABLE_EVENTS: "true"
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_AND_EVENT
      # Generated by bin/up.sh into the gitignored .run/; empty means LiteLLM refuses to start.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      # config.yaml has the attribute allowlist; config-default.yaml leaves it out (S4 negative).
      - ./litellm/${LITELLM_CONFIG:-config.yaml}:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LLMOBS_LITELLM_PORT:-34000}:4000"
    restart: unless-stopped
    depends_on: [otelcol, vllm]
    networks: [llm-net]

  gpu-push:
    image: python:3.12-slim
    container_name: llmobs-gpu-push
    command: ["python", "-u", "/app/gpu_push.py"]
    environment:
      OTLP_ENDPOINT: http://otelcol:4318/v1/metrics
      PUSH_INTERVAL: "10"
      PATH: /fake:/usr/local/bin:/usr/bin:/bin   # fake nvidia-smi first; drop this line and add `gpus: all` on a GPU box
    volumes:
      - ./gpu-push/gpu_push.py:/app/gpu_push.py:ro
      - ./gpu-push/fake-nvidia-smi:/fake/nvidia-smi:ro
    restart: unless-stopped
    depends_on: [otelcol]
    networks: [llm-net]

networks:
  llm-net:
    name: llmobs-net

volumes:
  llmobs-data:
