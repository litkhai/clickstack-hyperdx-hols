# Measuring gateway — one OTLP/HTTP port per (source, set), each written to its own file.
# No batch processor: what arrives is what is written, so the file count and the receiver's
# accepted-points counter must agree (check M1's control).
#
#   4318 linux base    4328 linux process
#   4319 windows base  4329 windows process
#
# Environment: OUT_DIR (where the .jsonl files go).

receivers:
  otlp/linux-base:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  otlp/linux-proc:
    protocols:
      http:
        endpoint: 0.0.0.0:4328
  otlp/windows-base:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
  otlp/windows-proc:
    protocols:
      http:
        endpoint: 0.0.0.0:4329

exporters:
  file/linux-base:
    path: ${env:OUT_DIR}/linux-base.jsonl
  file/linux-proc:
    path: ${env:OUT_DIR}/linux-proc.jsonl
  file/windows-base:
    path: ${env:OUT_DIR}/windows-base.jsonl
  file/windows-proc:
    path: ${env:OUT_DIR}/windows-proc.jsonl

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics/linux-base:
      receivers: [otlp/linux-base]
      exporters: [file/linux-base]
    metrics/linux-proc:
      receivers: [otlp/linux-proc]
      exporters: [file/linux-proc]
    metrics/windows-base:
      receivers: [otlp/windows-base]
      exporters: [file/windows-base]
    metrics/windows-proc:
      receivers: [otlp/windows-proc]
      exporters: [file/windows-proc]
