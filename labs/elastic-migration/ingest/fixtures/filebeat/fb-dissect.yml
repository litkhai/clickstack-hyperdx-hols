# Dissect with a target_prefix, add_fields / add_tags at input and top level.
filebeat.inputs:
  - type: filestream
    id: fb-dissect
    paths: [/var/log/app/worker.log]
    processors:
      - dissect:
          tokenizer: "%{ts} %{level} %{msg}"
          target_prefix: app
      - add_fields:
          target: meta
          fields: {team: platform, tier: 2}
      - add_tags:
          tags: [worker, nightly]
processors:
  - add_fields:
      target: ""
      fields: {env: prod}
  - add_tags:
      tags: [shipped]
output.elasticsearch:
  hosts: ["http://localhost:9200"]
