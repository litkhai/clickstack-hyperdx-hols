# if / else if / else: string and number ==, =~, !~, !, and, or, `in [list]`, a bare [field], and a drop {} in the
# last branch. OTTL has no else, so each branch is converted with the negation of the ones before it.
filter {
  grok {
    match => { "message" => "^%{WORD:method} %{NOTSPACE:path} %{INT:status:int}(?: user=%{WORD:user})?$" }
  }
  if [method] == "GET" and [status] == 200 {
    mutate { add_field => { "bucket" => "ok" } }
  } else if [status] in [301, 302] or [path] =~ /^\/old\// {
    mutate { add_field => { "bucket" => "moved" } }
  } else if [path] !~ /^\/api/ and ![user] {
    mutate { add_field => { "bucket" => "static" } }
  } else if [user] {
    mutate { add_field => { "bucket" => "user" } }
  } else {
    drop {}
  }
  if !([status] == 500) {
    mutate { add_tag => ["not_500"] }
  }
}
