# Plugins with no translation, runnable offline: ruby (arbitrary code), aggregate (state across events) and
# translate (a dictionary lookup, inline). geoip, elasticsearch and http need a database or the network at
# register time and are covered by the unit tests only.
filter {
  ruby { code => 'event.set("ruby_ran", true)' }
  aggregate {
    task_id => "%{message}"
    code => "map['seen'] = (map['seen'] || 0) + 1; event.set('seen', map['seen'])"
  }
  translate {
    source => "message"
    target => "color"
    dictionary => { "red" => "#f00" "blue" => "#00f" }
    fallback => "none"
  }
}
