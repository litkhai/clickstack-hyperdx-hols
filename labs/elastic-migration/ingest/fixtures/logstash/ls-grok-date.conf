# grok with [bracket] field references and :int, then date with an explicit timezone; add_field and
# add_tag on the grok (Logstash applies them only when the grok matched); the last line does not match.
filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:[app][ts]} %{LOGLEVEL:[app][level]} %{WORD:[app][module]} pid=%{INT:[app][pid]:int} %{GREEDYDATA:[app][text]}" }
    add_field => { "pipeline" => "ls-grok-date" }
    add_tag => ["parsed"]
  }
  date {
    match => ["[app][ts]", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd HH:mm:ss.SSS"]
    timezone => "Asia/Seoul"
  }
}
