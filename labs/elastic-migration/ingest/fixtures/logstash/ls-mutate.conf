# One mutate block, written in an order that is NOT mutate's own. Logstash 8.17.0 (mutate 3.5.8) runs the
# operations as: rename, update, replace, convert, gsub, uppercase, lowercase, strip, then add_field,
# remove_field, add_tag -- whatever order they are written in. So here rename runs before update (update sees
# `renamed` and sets it, on the lines that had `old`), and remove_field runs last (after rename moved `old`).
# Translated in the written order, `renamed` would never be set.
filter {
  grok {
    match => { "message" => [ "^%{WORD:name}\|%{DATA:padded}\|%{INT:code}\|%{DATA:path}\|%{WORD:old}$",
                              "^%{WORD:name}\|%{DATA:padded}\|%{INT:code}\|%{DATA:path}$" ] }
  }
  mutate {
    add_tag      => ["mutated"]
    remove_field => ["old"]
    add_field    => { "kind" => "demo" }
    strip        => ["padded"]
    lowercase    => ["path"]
    uppercase    => ["name"]
    gsub         => ["path", "/", "_"]
    convert      => { "code" => "integer" }
    replace      => { "source" => "ls-mutate" }
    update       => { "renamed" => "touched" }
    rename       => { "old" => "renamed" }
  }
}
