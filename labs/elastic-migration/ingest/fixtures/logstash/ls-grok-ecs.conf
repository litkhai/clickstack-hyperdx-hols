# %{COMBINEDAPACHELOG} under the default pipeline.ecs_compatibility (v8, which reads the ecs-v1 patterns): the
# fields come out with ECS names (source.address, http.request.method ...), not the legacy clientip / verb.
# HTTPDUSER is narrowed to USER: the stock one reaches EMAILLOCALPART, whose {1,62} inside {0,63} RE2 refuses
# (grok.py: counted repeats nest to 3906), so the stock pattern cannot be converted in ECS mode.
filter {
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
    pattern_definitions => { "HTTPDUSER" => "%{USER}" }
  }
}
