# dissect with convert_datatype, kv with a non-default field_split (";" instead of a space) into a target, and
# json twice: with a target (the object stays nested) and without (its keys go to the root). The lowercase on
# `level` comes last, after the json without a target (which may write any key, so check.py explains every
# difference before it): a converted step that owns `level`, so that a wrong dissect key shows as a MISMATCH.
filter {
  dissect {
    mapping => { "message" => "%{level}|%{count}|%{ratio}|%{pairs}|%{doc1}|%{doc2}" }
    convert_datatype => { "count" => "int" "ratio" => "float" }
  }
  kv { source => "pairs" field_split => ";" target => "kv" }
  json { source => "doc1" target => "parsed" }
  json { source => "doc2" }
  mutate { lowercase => ["level"] }
}
