# Local ClickStack 2.42.0 with ClickHouse's TimeSeries engine and Prometheus
# HTTP API switched on, for a PromQL source in HyperDX.
#
#   cp .env.example .env && docker compose up -d
#
# Host ports are shifted (28xxx) so it can sit next to _base/. Both stacks
# publish nothing on the same port, but both are heavy: run one at a time.
services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.42.0
    container_name: promql-lab
    restart: unless-stopped
    ports:
      - "${PROMQL_UI_PORT:-28080}:8080"       # HyperDX UI
      - "${PROMQL_API_PORT:-28000}:8000"      # HyperDX API (/api/v1/prometheus/...)
      - "${PROMQL_CH_HTTP_PORT:-28123}:8123"  # ClickHouse HTTP (+ /prometheus/api/v1)
    environment:
      # Off by default in HyperDX; the /api/v1/prometheus router only mounts with it.
      ENABLE_PROMQL: "true"
      # The UI flag: without it the chart editor has no PromQL mode (packages/app/src/config.ts,
      # IS_PROMQL_ENABLED), even though the API answers PromQL.
      NEXT_PUBLIC_ENABLE_PROMQL: "true"
    volumes:
      - promql-data:/data
      - ./config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./config/timeseries-user.xml:/etc/clickhouse-server/users.d/timeseries-user.xml:ro

volumes:
  promql-data:
