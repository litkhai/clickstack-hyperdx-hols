# Single-binary Loki, standing in for the existing Loki. Limits are opened up
# because the existing Kong sinks put per-request values (URI, request time,
# bytes) in labels, which makes one stream per distinct value.
apiVersion: v1
kind: Namespace
metadata: {name: loki}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config, namespace: loki}
data:
  config.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
      storage: {filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}}
    schema_config:
      configs:
        - {from: 2024-01-01, store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
    limits_config:
      max_global_streams_per_user: 0
      max_label_names_per_series: 30
      ingestion_rate_mb: 64
      ingestion_burst_size_mb: 128
      reject_old_samples: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: loki}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.9
          args: ["-config.file=/etc/loki/config.yaml"]
          ports: [{containerPort: 3100}]
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: loki}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: 3100}]
