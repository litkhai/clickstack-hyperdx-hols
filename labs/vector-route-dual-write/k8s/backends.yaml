# The two destinations Vector writes to: Loki (the pipeline that already
# exists) and ClickStack (the one being added). Lab only: no auth, local
# storage, one replica each.
apiVersion: v1
kind: Namespace
metadata: {name: loki}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config, namespace: loki}
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
      ingestion_rate_mb: 64
      ingestion_burst_size_mb: 128
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: loki}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.9
          args: ["-config.file=/etc/loki/config.yaml"]
          ports: [{containerPort: 3100}]
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: loki}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: 3100}]
---
apiVersion: v1
kind: Namespace
metadata: {name: clickstack}
---
# One volume for ClickHouse (/var/lib/clickhouse) and the UI's own store
# (MongoDB in /data/db), so scaling the Deployment to zero (the outage in `lab.py
# outage`) keeps tables and sources.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: clickstack-data, namespace: clickstack}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: clickstack, namespace: clickstack}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: clickstack}}
  template:
    metadata: {labels: {app: clickstack}}
    spec:
      containers:
        - name: clickstack
          image: clickhouse/clickstack-all-in-one:2.44.0
          ports:
            - {name: ui, containerPort: 8080}
            - {name: ch-http, containerPort: 8123}
          readinessProbe:
            httpGet: {path: /ping, port: 8123}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data/db, subPath: mongo}
            - {name: data, mountPath: /var/lib/clickhouse, subPath: clickhouse}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: clickstack-data}
---
apiVersion: v1
kind: Service
metadata: {name: clickstack, namespace: clickstack}
spec:
  selector: {app: clickstack}
  ports:
    - {name: ch-http, port: 8123, targetPort: 8123}
    - {name: ui, port: 8080, targetPort: 8080}
