# Tier B sidecar: a contrib collector holding receivers ClickStack's own build
# does not have, forwarding everything to it over OTLP.
#
#   ../bin/build-config.sh --tier b virt-vsphere > sidecar.config.yaml
#   docker compose --env-file .env up -d
#
# The image tag is pinned deliberately. Tier B profiles use alpha-stability
# receivers whose metric names can change between releases, so an unpinned
# `latest` would break dashboards on a silent image update. 0.155.0 is the
# component version ClickStack 2.39.1 is built from, which keeps both
# collectors on the same OTLP and semconv behaviour.

services:
  otel-sidecar:
    image: otel/opentelemetry-collector-contrib:0.155.0
    container_name: otel-sidecar
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/sidecar.config.yaml"]
    volumes:
      - ./sidecar.config.yaml:/etc/otelcol-contrib/sidecar.config.yaml:ro
    environment:
      CLICKSTACK_OTLP_ENDPOINT: ${CLICKSTACK_OTLP_ENDPOINT}
      CLICKSTACK_OTLP_INSECURE: ${CLICKSTACK_OTLP_INSECURE}
      # Falls back to HYPERDX_INGESTION_KEY, the name _base/ uses for the same
      # key, so `--env-file ../../_base/.env` is enough next to the local stack
      # and the key is not copied into a second file.
      CLICKSTACK_API_KEY: ${CLICKSTACK_API_KEY:-${HYPERDX_INGESTION_KEY:-}}
      VCENTER_ENDPOINT: ${VCENTER_ENDPOINT:-}
      VCENTER_USERNAME: ${VCENTER_USERNAME:-}
      VCENTER_PASSWORD: ${VCENTER_PASSWORD:-}
      VCENTER_TLS_INSECURE_SKIP_VERIFY: ${VCENTER_TLS_INSECURE_SKIP_VERIFY:-false}
      MYSQL_ENDPOINT: ${MYSQL_ENDPOINT:-}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_TLS_INSECURE: ${MYSQL_TLS_INSECURE:-false}
      RDS_MYSQL_ENDPOINT: ${RDS_MYSQL_ENDPOINT:-}
      RDS_MYSQL_USERNAME: ${RDS_MYSQL_USERNAME:-}
      RDS_MYSQL_PASSWORD: ${RDS_MYSQL_PASSWORD:-}
      RDS_DB_INSTANCE_IDENTIFIER: ${RDS_DB_INSTANCE_IDENTIFIER:-}
      RDS_RESOURCE_ID: ${RDS_RESOURCE_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      # Picked up directly by the AWS SDK's own environment credential chain,
      # not referenced via ${env:...} in aws-rds-mysql's sidecar.config.yaml --
      # passed through here only so they reach the container at all.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      # health_check from base.yaml. _base/docker-compose.yml publishes 13133
      # for its own collector; set SIDECAR_HEALTH_PORT (e.g. 13134) when both
      # run on one machine, or the second `up` fails with "port is already
      # allocated". The default is unchanged.
      - "${SIDECAR_HEALTH_PORT:-13133}:13133"
